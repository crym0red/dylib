name: Build DELvEK Theme dylib

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/**"
      - "Makefile"
      - ".github/workflows/build-dylib.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Makefile"
      - ".github/workflows/build-dylib.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build iOS arm64 dylib
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos clang --version

      - name: Build
        run: |
          set -euo pipefail
          make clean
          make
          test -f build/DELvEKTheme.dylib
          file build/DELvEKTheme.dylib
          xcrun lipo -info build/DELvEKTheme.dylib
          xcrun otool -l build/DELvEKTheme.dylib | grep -A5 LC_BUILD_VERSION || true

      - name: Package artifact
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact/DELvEKTheme
          cp build/DELvEKTheme.dylib artifact/DELvEKTheme/
          cp -R Sources artifact/DELvEKTheme/
          cp Makefile README.md artifact/DELvEKTheme/
          cd artifact
          zip -qry DELvEKTheme-dylib.zip DELvEKTheme

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DELvEKTheme-dylib
          path: artifact/DELvEKTheme-dylib.zip
          if-no-files-found: error
